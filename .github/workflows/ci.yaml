name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  DEFAULT_GO_VERSION: "~1.27.0"
jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Generate
        run: make clean protobuf
      - name: Check
        run: make toolchain-check check-clean-work-tree
  compatibility-test:
    strategy:
      matrix:
        go-version: ["~1.27.0", "~1.26.0"]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache-dependency-path: "**/go.sum"
    - name: Generate
      run: make clean protobuf go-mod-tidy
    - name: Check
      run: make check-clean-work-tree
    - name: Run tests
      run: make test
  test-compatibility:
    runs-on: ubuntu-latest
    needs: [compatibility-test]
    if: always()
    steps:
      - name: Test if compatibility-test workflow passed
        run: |
          echo ${{ needs.compatibility-test.result }}
          test ${{ needs.compatibility-test.result }} == "success"
